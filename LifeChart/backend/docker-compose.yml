# LifeChart in the homelab, reachable only through Cloudflare.
#
#   iPhone ──HTTPS──▶ Cloudflare (Access) ──Tunnel──▶ cloudflared ──▶ lifechart:8080
#
# No ports are published on the host; cloudflared makes an outbound connection.

services:
  lifechart:
    build: .
    container_name: lifechart
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    volumes:
      - ./data:/data
    networks:
      - lifechart
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: lifechart-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - lifechart
    networks:
      - lifechart
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  lifechart:
