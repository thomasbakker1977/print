name: LifeChart

on:
  push:
    paths:
      - "LifeChart/**"
      - ".github/workflows/lifechart.yml"
  pull_request:
    paths:
      - "LifeChart/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS app (Xcode build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project LifeChart/LifeChart.xcodeproj \
            -target LifeChart \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LifeChart/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
